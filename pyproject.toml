[project]
name = "wealthpilot"
version = "0.1.0"
description = "Local-first WealthPilot MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "baostock==0.9.3",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/python/wealthpilot"]

[tool.uv]
required-version = "==0.11.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/python"]
addopts = "-q"
